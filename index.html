<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI業務用語集シリーズ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 680px;
      width: 100%;
    }
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    header h1 {
      font-size: 2rem;
      color: #1a1a2e;
      margin-bottom: 12px;
    }
    header p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 28px 32px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 24px;
      transition: transform 0.15s, box-shadow 0.15s;
      border-left: 5px solid #4f8ef7;
    }
    .card:nth-child(2) { border-left-color: #7c5cbf; }
    .card:nth-child(3) { border-left-color: #2aaaa8; }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
    .vol {
      font-size: 1.6rem;
      font-weight: 900;
      color: #4f8ef7;
      min-width: 60px;
    }
    .card:nth-child(2) .vol { color: #7c5cbf; }
    .card:nth-child(3) .vol { color: #2aaaa8; }
    .info h2 {
      font-size: 1.1rem;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .info p {
      font-size: 0.85rem;
      color: #888;
    }
    footer {
      text-align: center;
      margin-top: 48px;
      color: #bbb;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>AI業務用語集シリーズ</h1>
      <p>AI・Claude Code・AIエージェントに関する用語をわかりやすく解説したリファレンス集です。</p>
    </header>
    <div class="cards">
      <a class="card" href="vol01-ai-glossary.html">
        <div class="vol">Vol.1</div>
        <div class="info">
          <h2>AI業務用語集</h2>
          <p>AIを仕事で使うための基本用語を網羅</p>
        </div>
      </a>
      <a class="card" href="vol02-claude-code-glossary.html">
        <div class="vol">Vol.2</div>
        <div class="info">
          <h2>Claude Code用語集</h2>
          <p>Claude Code を使いこなすための専門用語</p>
        </div>
      </a>
      <a class="card" href="vol03-ai-agent-glossary.html">
        <div class="vol">Vol.3</div>
        <div class="info">
          <h2>AIエージェント用語集</h2>
          <p>AIエージェント設計・運用に必要な用語集</p>
        </div>
      </a>
    </div>
    <footer>AI業務用語集シリーズ</footer>
  </div>
</body>
</html>
